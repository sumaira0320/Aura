{% if page_obj.has_other_pages %}
<div style="display:flex; justify-content:space-between; align-items:center; padding-top:1.5rem; margin-top:1.5rem; border-top:1px solid var(--border);">
    <div style="font-size:0.875rem; color:var(--text-muted);">
        Showing page <strong>{{ page_obj.number }}</strong> of <strong>{{ page_obj.paginator.num_pages }}</strong>
    </div>
    <div style="display:flex; gap:0.25rem;">
        {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}{% if query %}&q={{ query }}{% endif %}" class="btn btn-secondary" style="padding:0.25rem 0.75rem; font-size:0.875rem;">Previous</a>
        {% else %}
        <button class="btn btn-secondary" style="padding:0.25rem 0.75rem; font-size:0.875rem; opacity:0.5; cursor:not-allowed;" disabled>Previous</button>
        {% endif %}
        
        {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query }}{% endif %}" class="btn btn-secondary" style="padding:0.25rem 0.75rem; font-size:0.875rem;">Next</a>
        {% else %}
        <button class="btn btn-secondary" style="padding:0.25rem 0.75rem; font-size:0.875rem; opacity:0.5; cursor:not-allowed;" disabled>Next</button>
        {% endif %}
    </div>
</div>
{% endif %}
